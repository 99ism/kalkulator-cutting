<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Cutting</title>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="kalkulator_cutting" />
</head>
<body>
    <canvas id="the_canvas_id"></canvas>

    <script type="module">
        window.addEventListener("TrunkApplicationStarted", () => {
            const handle = new window.wasmBindings.WebHandle();
            const canvas = document.getElementById("the_canvas_id");
            handle.start(canvas);
        });
    </script>
</body>
</html>
